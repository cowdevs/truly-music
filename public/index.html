<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Truly Music | YouTube Playlist Shuffler</title>
    <meta property="og:site_name" content="Truly Music"/>
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "Truly Music",
            "url": "https://truly-music.web.app"
        }
    </script>

    <meta name="description"
          content="A Youtube music player that shuffles your playlists properly. Free, ad-free, with background play and media controls.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="icon" type="image/png" href="./img/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="./img/favicon.svg"/>
    <link rel="shortcut icon" href="./favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="./img/apple-touch-icon.png"/>
    <meta name="apple-mobile-web-app-title" content="Truly Music"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./site.webmanifest"/>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,300,0..1"/>

    <link rel="stylesheet" href="./css/style.css"/>
    <script src="./js/script.js" defer></script>

    <meta name="google-site-verification" content="J1GRfjtPmd4p5M9_qjJSy-b-A_yzI99RA1UMsvtf6nQ"/>
</head>
<body>

<div id="ambient-glow" class="ambient-glow" aria-hidden="true"></div>

<div id="setup-screen" class="device-panel screen">
    <div class="setup-card">
        <div class="setup-header">
            <span class="power-dot"></span>
            <h1>truly music</h1>
            <p>Shuffle your YouTube Music playlists properly!</p>
        </div>

        <div class="field">
            <label for="playlist-input">Playlist URL or ID</label>
            <input id="playlist-input" type="text" placeholder="https://youtube.com/playlist?list=..."
                   autocomplete="off" spellcheck="false">
        </div>

        <button id="load-playlist-btn" class="btn-primary">Load playlist</button>
        <p id="setup-error" class="error-text hidden"></p>
        <div id="setup-loading" class="loading-row hidden">
            <span class="spinner"></span>
            <span id="setup-loading-text">Fetching tracks…</span>
        </div>

        <div id="saved-section" class="hidden">
            <div class="divider">recent playlists</div>
            <ul id="saved-list" class="saved-list"></ul>
        </div>
    </div>

    <a class="github-link" href="https://github.com/cowdevs/truly-music" target="_blank" rel="noopener noreferrer"
       aria-label="View Truly Music on GitHub" title="View on GitHub">
        <img src="./img/github.svg" alt="" aria-hidden="true">
    </a>
</div>

<div id="player-screen" class="device-panel screen hidden">
    <div class="topbar">
        <div class="brand">
            <span id="power-dot" class="power-dot"></span>
            <button id="setup-btn" class="wordmark" type="button" title="Back to setup">truly music</button>
        </div>
        <div class="topbar-actions">
            <button id="queue-btn" class="icon-btn" title="Open queue" aria-label="Open queue">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false">
                <span class="material-symbols-outlined">settings</span>
            </button>
        </div>
    </div>

    <div class="display-area">
        <div class="display-frame">
            <div id="yt-player"></div>
        </div>
    </div>

    <div class="track-info">
        <a id="track-title" class="track-title" href="#" target="_blank" rel="noopener noreferrer"
           title="Open on YouTube">—</a>
        <a id="track-channel" class="track-channel" href="#" target="_blank" rel="noopener noreferrer"
           title="Open artist on YouTube Music">—</a>
    </div>

    <div class="progress-row">
        <span id="cur-time" class="time" draggable="false">0:00</span>
        <input id="seek-input" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek">
        <span id="dur-time" class="time end" draggable="false">0:00</span>
    </div>

    <div class="controls-row">
        <button id="reshuffle-btn" class="btn-circle" title="Reshuffle queue" aria-label="Reshuffle queue">
            <span class="material-symbols-outlined filled">shuffle</span>
        </button>
        <button id="prev-btn" class="btn-circle" title="Previous" aria-label="Previous track">
            <span class="material-symbols-outlined filled">skip_previous</span>
        </button>
        <button id="play-pause-btn" class="btn-circle primary" title="Play/Pause" aria-label="Play or pause">
            <span id="icon-play" class="material-symbols-outlined filled">play_arrow</span>
            <span id="icon-pause" class="material-symbols-outlined filled" style="display:none;">pause</span>
        </button>
        <button id="next-btn" class="btn-circle" title="Next" aria-label="Next track">
            <span class="material-symbols-outlined filled">skip_next</span>
        </button>
        <button id="repeat-btn" class="btn-circle" title="Repeat: off" aria-label="Repeat mode">
            <span class="material-symbols-outlined filled">repeat</span>
            <span id="repeat-badge" class="repeat-badge hidden">1</span>
        </button>
    </div>

    <div class="volume-row">
        <span class="material-symbols-outlined">volume_up</span>
        <input id="volume-input" type="range" min="0" max="100" value="80" aria-label="Volume">
    </div>

    <div id="drawer-backdrop" class="drawer-backdrop"></div>
    <div class="drawer-slot">
        <div id="queue-drawer" class="drawer">
            <div class="drawer-header">
                <h2>Up next</h2>
                <button id="drawer-close-btn" class="icon-btn" aria-label="Close queue">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <ul id="queue-list" class="queue-list"></ul>
        </div>
    </div>
</div>

<div id="settings-backdrop" class="settings-backdrop" aria-hidden="true">
    <section id="settings-dialog" class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title" tabindex="-1">
        <div class="drawer-header">
            <h2 id="settings-title">Settings</h2>
            <button id="settings-close-btn" class="icon-btn" type="button" aria-label="Close settings">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <h2>coming soon</h2>
    </section>
</div>

<div id="toast" class="toast"></div>

<audio id="silent-audio" loop></audio>

<script type="module">
    import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {getAnalytics} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCIlhOT-1FtO3S5_bVaNBLKklDhM_0-wzw",
        authDomain: "truly-music.firebaseapp.com",
        projectId: "truly-music",
        storageBucket: "truly-music.firebasestorage.app",
        messagingSenderId: "246677885946",
        appId: "1:246677885946:web:79ba76bbb354996cc0ca43",
        measurementId: "G-0KDQ6EVRDD"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
</script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        document.title = "Truly Music";
    });
</script>

</body>
</html>
