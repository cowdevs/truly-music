<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Truly Music | YouTube Playlist Shuffler</title>
    <meta name="description"
          content="A truly random Youtube playlist shuffler! Load and listen to any playlist uninterrupted in a clean, ad-free music player. Play in background on mobile.">
    <link rel="icon" type="image/png" href="favicon.png" sizes="144x144"/>
    <link rel="canonical" href="https://truly-music.web.app/">

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "Truly Music",
            "url": "https://truly-music.web.app/"
        }
    </script>

    <link rel="icon" type="image/svg+xml" href="images/favicon.svg"/>
    <link rel="shortcut icon" href="favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png"/>
    <meta name="apple-mobile-web-app-title" content="Truly Music"/>
    <link rel="manifest" href="manifest.json"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&family=Space+Mono:wght@400;500;600&display=swap"/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@24,300,0..1"/>

    <link rel="stylesheet" href="css/style.css"/>
    <script src="js/script.js" defer></script>

    <meta name="google-site-verification" content="J1GRfjtPmd4p5M9_qjJSy-b-A_yzI99RA1UMsvtf6nQ"/>
</head>
<body>

<div id="ambient-glow" class="ambient-glow" aria-hidden="true"></div>

<div id="setup-screen" class="device-panel screen">
    <div class="setup-card">
        <div class="setup-header">
            <span class="power-dot"></span>
            <h1>truly music</h1>
            <p>Shuffle your YouTube Music playlists properly!</p>
        </div>

        <div class="field">
            <label for="playlist-input">Playlist URL or ID</label>
            <input id="playlist-input" type="text" placeholder="https://youtube.com/playlist?list=..."
                   autocomplete="off" spellcheck="false">
        </div>

        <button id="load-playlist-btn" class="btn-primary">Load playlist</button>
        <p id="setup-error" class="error-text hidden"></p>
        <div id="setup-loading" class="loading-row hidden">
            <span class="spinner"></span>
            <span id="setup-loading-text">Fetching tracks…</span>
        </div>

        <div id="saved-section" class="hidden">
            <div class="divider">recent playlists</div>
            <ul id="saved-list" class="saved-list"></ul>
        </div>
    </div>
</div>

<div id="player-screen" class="device-panel screen hidden">
    <div class="topbar">
        <div class="brand">
            <span id="power-dot" class="power-dot"></span>
            <button id="setup-btn" class="wordmark" type="button" title="Back to setup">truly music</button>
        </div>
        <div class="topbar-actions">
            <button id="queue-btn" class="icon-btn" title="Open queue" aria-label="Open queue">
                <span class="material-symbols-rounded">menu</span>
            </button>
            <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
                <span class="material-symbols-rounded">settings</span>
            </button>
        </div>
    </div>

    <div class="display-area">
        <div class="display-frame">
            <div id="yt-player"></div>
        </div>
    </div>

    <div class="track-info">
        <a id="track-title" class="track-title" href="#" target="_blank" rel="noopener noreferrer"
           title="Open on YouTube">—</a>
        <a id="track-channel" class="track-channel" href="#" target="_blank" rel="noopener noreferrer"
           title="Open artist on YouTube Music">—</a>
    </div>

    <div class="progress-row">
        <span id="cur-time" class="time" draggable="false">0:00</span>
        <input id="seek-input" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek">
        <span id="dur-time" class="time end" draggable="false">0:00</span>
    </div>

    <div class="controls-row">
        <button id="reshuffle-btn" class="btn-circle" title="Reshuffle queue" aria-label="Reshuffle queue">
            <span class="material-symbols-rounded filled">shuffle</span>
        </button>
        <button id="prev-btn" class="btn-circle" title="Previous" aria-label="Previous track">
            <span class="material-symbols-rounded filled">skip_previous</span>
        </button>
        <button id="play-pause-btn" class="btn-circle primary" title="Play/Pause" aria-label="Play or pause">
            <span id="icon-play" class="material-symbols-rounded filled">play_arrow</span>
            <span id="icon-pause" class="material-symbols-rounded filled" style="display:none;">pause</span>
        </button>
        <button id="next-btn" class="btn-circle" title="Next" aria-label="Next track">
            <span class="material-symbols-rounded filled">skip_next</span>
        </button>
        <button id="repeat-btn" class="btn-circle" title="Repeat: off" aria-label="Repeat mode">
            <span id="repeat-icon" class="material-symbols-rounded filled">repeat</span>
        </button>
    </div>

    <div id="drawer-backdrop" class="drawer-backdrop"></div>
    <div class="drawer-slot">
        <div id="queue-drawer" class="drawer">
            <div class="drawer-header">
                <h2>Up next</h2>
                <button id="drawer-close-btn" class="icon-btn" aria-label="Close queue">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="drawer-search">
                <span class="material-symbols-rounded">search</span>
                <input id="queue-search-input" type="text" placeholder="Search playlist..." autocomplete="off"
                       spellcheck="false" aria-label="Search queue">
            </div>
            <ul id="queue-list" class="queue-list"></ul>
            <div id="queue-search-empty" class="empty-note hidden">No tracks match your search.</div>
        </div>
    </div>
</div>

<div id="settings-backdrop" class="settings-backdrop" aria-hidden="true">
    <section id="settings-dialog" class="settings-dialog" role="dialog" aria-modal="true"
             aria-labelledby="settings-title" tabindex="-1">
        <div class="drawer-header">
            <h2 id="settings-title">Settings</h2>
            <button id="settings-close-btn" class="icon-btn" type="button" aria-label="Close settings">
                <span class="material-symbols-rounded">close</span>
            </button>
        </div>
        <div class="settings-content">
            <div class="settings-option">
                <label class="settings-option-label" for="volume-input">
                    <span class="material-symbols-rounded" aria-hidden="true">volume_up</span>
                    Volume
                </label>
                <input id="volume-input" type="range" min="0" max="100" value="80" aria-label="Volume">
                <output id="volume-value" for="volume-input">80%</output>
            </div>
            <div class="settings-option setting-toggle-option">
                <div class="settings-option-header">
                    <div class="setting-description">
                        <span class="material-symbols-rounded" aria-hidden="true">speed</span>
                        <label for="reduce-effects-input">Reduce Visual Effects</label>
                    </div>
                    <input id="reduce-effects-input" class="setting-switch" type="checkbox" role="switch"
                           aria-label="Reduce Visual Effects">
                </div>
            </div>
        </div>
        <footer class="settings-footer">
            <span>made with ♥ by cowdevs</span>
            <a class="github-link" href="https://github.com/cowdevs/truly-music" target="_blank"
               rel="noopener noreferrer" aria-label="View Truly Music on GitHub" title="View on GitHub">
                <img src="images/github.svg" alt="" aria-hidden="true">
            </a>
        </footer>
    </section>
</div>

<div id="toast" class="toast"></div>

<audio id="silent-audio" loop></audio>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        document.title = "Truly Music";
    });
</script>

    const firebaseConfig = {

        measurementId: "G-0KDQ6EVRDD"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
</script>

</body>
</html>
