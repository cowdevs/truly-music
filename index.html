<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truly Music</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="./images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,300,0..1"/>
    <link rel="stylesheet" href="./css/style.css"/>
    <script src="./js/script.js" defer></script>
</head>
<body>

<!-- ============ SETUP SCREEN ============ -->
<div id="setup-screen" class="device-panel screen">
    <div class="setup-card">
        <div class="setup-header">
            <span class="power-dot"></span>
            <h1>truly music</h1>
            <p>Shuffle your YouTube Music playlists properly!</p>
        </div>

        <div class="field">
            <label for="playlist-input">Playlist URL or ID</label>
            <input id="playlist-input" type="text" placeholder="https://music.youtube.com/playlist?list=…"
                   autocomplete="off" spellcheck="false">
        </div>

        <button id="load-playlist-btn" class="btn-primary">Load playlist</button>
        <p id="setup-error" class="error-text hidden"></p>
        <div id="setup-loading" class="loading-row hidden">
            <span class="spinner"></span>
            <span id="setup-loading-text">Fetching tracks…</span>
        </div>

        <div id="saved-section" class="hidden">
            <div class="divider">recent playlists</div>
            <ul id="saved-list" class="saved-list"></ul>
        </div>
    </div>
</div>

<!-- ============ PLAYER SCREEN ============ -->
<div id="player-screen" class="device-panel screen hidden">
    <div class="topbar">
        <div class="brand">
            <span id="power-dot" class="power-dot"></span>
            <span class="wordmark" draggable="false">truly music</span>
        </div>
        <div class="topbar-actions">
            <button id="queue-btn" class="icon-btn" title="Open queue" aria-label="Open queue">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <button id="home-btn" class="icon-btn" title="Change playlist" aria-label="Change playlist">
                <span class="material-symbols-outlined">settings</span>
            </button>
        </div>
    </div>

    <div class="display-frame">
        <img id="album-art" alt="" src="" style="display:none;" draggable="false">
        <div id="display-placeholder" class="display-placeholder">Loading track…</div>
        <button id="display-overlay" class="display-overlay" aria-label="Play or pause">
            <span id="overlay-icon-play" class="material-symbols-outlined filled">play_arrow</span>
            <span id="overlay-icon-pause" class="material-symbols-outlined filled" style="display:none;">pause</span>
        </button>
    </div>

    <div class="track-info">
        <a id="track-title" class="track-title" href="#" target="_blank" rel="noopener noreferrer"
           title="Open on YouTube">—</a>
        <a id="track-channel" class="track-channel" href="#" target="_blank" rel="noopener noreferrer"
           title="Open artist on YouTube Music">—</a>
    </div>

    <div class="progress-row">
        <span id="cur-time" class="time" draggable="false">0:00</span>
        <input id="seek-input" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek">
        <span id="dur-time" class="time end" draggable="false">0:00</span>
    </div>

    <div class="controls-row">
        <button id="reshuffle-btn" class="btn-circle" title="Reshuffle queue" aria-label="Reshuffle queue">
            <span class="material-symbols-outlined filled">shuffle</span>
        </button>
        <button id="prev-btn" class="btn-circle" title="Previous" aria-label="Previous track">
            <span class="material-symbols-outlined filled">skip_previous</span>
        </button>
        <button id="play-pause-btn" class="btn-circle primary" title="Play/Pause" aria-label="Play or pause">
            <span id="icon-play" class="material-symbols-outlined filled">play_arrow</span>
            <span id="icon-pause" class="material-symbols-outlined filled" style="display:none;">pause</span>
        </button>
        <button id="next-btn" class="btn-circle" title="Next" aria-label="Next track">
            <span class="material-symbols-outlined filled">skip_next</span>
        </button>
        <button id="repeat-btn" class="btn-circle" title="Repeat: off" aria-label="Repeat mode">
            <span class="material-symbols-outlined filled">repeat</span>
            <span id="repeat-badge" class="repeat-badge hidden">1</span>
        </button>
    </div>

    <div class="volume-row">
        <span class="material-symbols-outlined">volume_up</span>
        <input id="volume-input" type="range" min="0" max="100" value="80" aria-label="Volume">
    </div>
</div>

<!-- ============ QUEUE DRAWER ============ -->
<div id="drawer-backdrop" class="drawer-backdrop"></div>
<div id="queue-drawer" class="drawer">
    <div class="drawer-header">
        <h2>Up next</h2>
        <button id="drawer-close-btn" class="icon-btn" aria-label="Close queue">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>

    <ul id="queue-list" class="queue-list"></ul>
</div>

<div id="toast" class="toast"></div>

<div id="yt-player-container">
    <div id="yt-player"></div>
</div>
<audio id="silent-audio" loop></audio>

</body>
</html>
